<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)"/>
  
  <!-- Book Base -->
  <path d="M128 180 L256 140 L384 180 L384 360 L256 320 L128 360 Z" 
        fill="#ffffff" opacity="0.95"/>
  <path d="M256 140 L256 320" stroke="#6366f1" stroke-width="3" fill="none"/>
  <path d="M128 180 L256 220 L384 180" stroke="#6366f1" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Book Pages Lines -->
  <line x1="150" y1="210" x2="240" y2="185" stroke="#c4b5fd" stroke-width="2"/>
  <line x1="150" y1="240" x2="240" y2="215" stroke="#c4b5fd" stroke-width="2"/>
  <line x1="150" y1="270" x2="240" y2="245" stroke="#c4b5fd" stroke-width="2"/>
  <line x1="272" y1="185" x2="362" y2="210" stroke="#c4b5fd" stroke-width="2"/>
  <line x1="272" y1="215" x2="362" y2="240" stroke="#c4b5fd" stroke-width="2"/>
  <line x1="272" y1="245" x2="362" y2="270" stroke="#c4b5fd" stroke-width="2"/>
  
  <!-- Graduation Cap -->
  <polygon points="256,80 180,120 256,160 332,120" fill="#1e1b4b"/>
  <rect x="248" y="120" width="16" height="40" fill="#1e1b4b"/>
  <ellipse cx="256" cy="168" rx="8" ry="4" fill="#1e1b4b"/>
  <line x1="264" y1="168" x2="280" y2="145" stroke="#1e1b4b" stroke-width="3"/>
  <circle cx="280" cy="142" r="6" fill="url(#grad2)"/>
  
  <!-- AI Sparkle -->
  <g transform="translate(370, 100)">
    <polygon points="0,-25 6,-6 25,0 6,6 0,25 -6,6 -25,0 -6,-6" fill="url(#grad2)"/>
  </g>
  
  <!-- Small Sparkles -->
  <g transform="translate(420, 160)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#fbbf24" opacity="0.8"/>
  </g>
  <g transform="translate(400, 80)">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#fbbf24" opacity="0.6"/>
  </g>
  
  <!-- Heart (Inclusive/Caring) -->
  <path d="M256 420 
           C220 390 160 350 160 310 
           C160 270 190 250 220 250 
           C245 250 256 270 256 270 
           C256 270 267 250 292 250 
           C322 250 352 270 352 310 
           C352 350 292 390 256 420 Z" 
        fill="#ec4899" opacity="0.9"/>
</svg>